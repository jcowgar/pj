[package]
name = "pj"
version = "0.1.0"
edition = "2024"
description = "Lightning-fast project directory jumper with fuzzy matching"
license = "GPL-3.0"
authors = ["Jeremy Cowgar <jeremy@cowgar.com>"]

[dependencies]
nucleo = "0.5"
nucleo-picker = "0.9"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
dirs = "6.0"
anyhow = "1.0"
shellexpand = "3.1"

[package.metadata.deb]
maintainer = "Jeremy Cowgar"
copyright = "2025, Jeremy Cowgar"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/pj", "usr/bin/", "755"],
    ["pj.sh", "usr/share/pj/", "644"],
    ["pj.fish", "usr/share/pj/", "644"],
    ["pj.xsh", "usr/share/pj/", "644"],
]

[package.metadata.generate-rpm]
summary = "Lightning-fast project directory jumper with fuzzy matching"
license = "GPL-3.0"
group = "Applications/Development"
assets = [
    { source = "target/release/pj", dest = "/usr/bin/pj", mode = "0755" },
    { source = "pj.sh", dest = "/usr/share/pj/pj.sh", mode = "0644" },
    { source = "pj.fish", dest = "/usr/share/pj/pj.fish", mode = "0644" },
    { source = "pj.xsh", dest = "/usr/share/pj/pj.xsh", mode = "0644" },
]

[dev-dependencies]
tempfile = "3.13"
